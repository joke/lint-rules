name: release

on:
  push:
    branches: [main]
  # Re-publishes a release whose publish job failed. A re-run cannot do that once the workflow has
  # been fixed, because it reuses the workflow file of the original run.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. pmd-rules-v1.0.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # The packages live in sub-paths, so release-please reports them as `<path>--release_created`;
    # the unprefixed `release_created` and `tag_name` describe only a root package and stay empty
    # here. `releases_created` covers every package. It is the string 'true' or 'false', so it is
    # compared explicitly - `!'false'` would be false.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
    # Manifest mode: the action reads release-please-config.json and .release-please-manifest.json
    # itself. Those same two files are what the build reads to compute the version, so the release
    # policy is stated once and neither side can drift from the other.
    - uses: GoogleCloudPlatform/release-please-action@v5.0
      id: release

  # Publishes to Maven Central only when release-please actually cut a release (releases_created) -
  # an ordinary push to main that merely updates the pending release PR never reaches this job, and
  # no -SNAPSHOT version is ever published from here.
  publish:
    needs: release-please
    if: >-
      ${{ needs.release-please.outputs.releases_created == 'true'
      || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
    # On a push, the pushed commit is the one release-please tagged.
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag || github.sha }}
        # The version is computed from the commits since the released version; the plugin fails the
        # build on a shallow clone rather than guessing.
        fetch-depth: 0
    - uses: jdx/mise-action@v4
    - uses: crazy-max/ghaction-import-gpg@v7
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}
        fingerprint: ${{ secrets.GPG_FINGERPRINT }}
    - uses: gradle/actions/setup-gradle@v6
    - run: ./gradlew publishAggregationToCentralPortal
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.mavenCentralUsername }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.mavenCentralPassword }}

  # The complement of `publish`: every push to main that did not cut a release publishes the next
  # planned version as a snapshot, so main is always consumable. A release commit publishes only the
  # release.
  #
  # Signs exactly as `publish` does, with the same action and the same secrets. Central does not
  # require signatures on snapshots, but publishing them unsigned would leave the key, the
  # passphrase, the fingerprint and signMavenPublication untested until the one run where a failure
  # cannot be withdrawn. Every merge to main rehearses the release path instead.
  snapshot:
    needs: release-please
    if: >-
      ${{ github.event_name == 'push'
      && needs.release-please.outputs.releases_created != 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: jdx/mise-action@v4
    - uses: crazy-max/ghaction-import-gpg@v7
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}
        fingerprint: ${{ secrets.GPG_FINGERPRINT }}
    - uses: gradle/actions/setup-gradle@v6
    - run: ./gradlew publishAggregationToCentralSnapshots
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.mavenCentralUsername }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.mavenCentralPassword }}
