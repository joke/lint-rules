plugins {
    id 'java-platform'
    id 'conventions'
}

javaPlatform {
    allowDependencies()
}

dependencies {

    api platform('org.junit:junit-bom:6.1.3')

    constraints {
        api 'io.github.joke.jspecify:processor:1.0.0'
        api 'io.github.joke:spock-deepmock:5.0.0'
        api 'net.sourceforge.pmd:pmd-core:7.29.0'
        api 'net.sourceforge.pmd:pmd-java:7.29.0'
        api 'net.sourceforge.pmd:pmd-test:7.29.0'
        api 'org.apache.groovy:groovy:5.1.3'
        api 'net.bytebuddy:byte-buddy:1.18.16-jdk5'
        api 'org.assertj:assertj-core:3.27.7'
        api 'org.codenarc:CodeNarc:4.0.0'
        api 'org.jetbrains:annotations:26.1.0'
        api 'org.jspecify:jspecify:1.0.1'
        api 'org.mockito:mockito-core:5.24.0'
        api 'org.ow2.asm:asm:9.11.1'
        api 'org.projectlombok:lombok:1.18.48'
        api 'org.spockframework:spock-core:2.5-groovy-6.0'
    }

}
