plugins {
    id 'java'
    id 'groovy'
    id 'maven-publish'
    id 'conventions'
}

description = 'Custom PMD 7 rules, published as a ruleset any project can put on its pmd configuration'

publishing {
    publications {
        relocation(MavenPublication) {
            groupId = 'io.github.joke.pmd'
            artifactId = 'rules'
            pom {
                name = 'rules'
                description = project.description
                distributionManagement {
                    relocation {
                        groupId = 'io.github.joke.lint'
                        artifactId = 'pmd-rules'
                        message = 'groupId and artifactId changed: this project now publishes PMD and CodeNarc rules as separate artifacts under io.github.joke.lint.'
                    }
                }
            }
        }
    }
}

dependencies {
    annotationProcessor platform(project(':dependencies'))
    annotationProcessor 'io.github.joke.jspecify:processor'
    annotationProcessor 'org.projectlombok:lombok'

    codenarc project(':codenarc-rules')
    pmd project(':pmd-rules')

    compileOnly platform(project(':dependencies'))
    compileOnly 'net.sourceforge.pmd:pmd-core'
    compileOnly 'net.sourceforge.pmd:pmd-java'
    compileOnly 'org.jetbrains:annotations'
    compileOnly 'org.jspecify:jspecify'
    compileOnly 'org.projectlombok:lombok'

    testImplementation platform(project(':dependencies'))
    testImplementation 'net.sourceforge.pmd:pmd-core'
    testImplementation 'net.sourceforge.pmd:pmd-java'
    testImplementation 'io.github.joke:spock-deepmock'
    testImplementation 'net.bytebuddy:byte-buddy'
    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.spockframework:spock-core'

    testCompileOnly 'org.jetbrains:annotations'

    testRuntimeOnly platform(project(':dependencies'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.ow2.asm:asm'
}
