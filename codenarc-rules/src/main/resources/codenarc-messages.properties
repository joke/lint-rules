AvoidCardinalityOnStub.description=Reports an interaction on a Stub that carries a cardinality other than _. A stub is not verified, and Spock rejects a required interaction on one.
AvoidMockInitializerClosure.description=Reports a call to Mock, Stub or Spy whose last argument is a closure.
AvoidSetupAndGivenLabels.description=Reports a setup: or given: statement label inside a Spock feature method.
AvoidSharedOrStaticMock.description=Reports a field that is @Shared or static and is initialised from Mock, Stub or Spy.
AvoidSpyStaticInLabelledBlock.description=Reports a call to SpyStatic under any Spock statement label inside a feature method.
AvoidUnrollAnnotation.description=Reports @Unroll on a specification class or a feature method.
DeclareMockWithExplicitType.description=Reports a dynamically-typed declaration whose initialiser is a call to Mock, Stub or Spy.
InteractionsBelongInThenBlock.description=Reports a Spock interaction outside a then: block.
RequireSpyEntryInteraction.description=Reports a then: block that declares interactions on a Spy without also declaring 1 * spy._.
RequireSpyInteractionResponse.description=Reports a counted interaction on a Spy that states no response.
RequireStrictMockingTerminator.description=Reports a then: block whose last statement is not 0 * _.
RequireValidatedInteractionArguments.description=Reports an interaction argument that places no constraint on the value passed.
UseVerifyAllForMultipleProperties.description=Reports an interaction's constraint closure that asserts more than one property without verifyAll.
ValueAssertionsBelongInExpectBlock.description=Reports a boolean expression in a then: block.
